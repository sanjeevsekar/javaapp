<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanjeev Ecomm Store</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="navbar">
    <div class="brand"><span class="cart">🛒</span> Product Store</div>
    <nav>
        <a class="active" href="/">Home</a>
        <a href="#products">Products</a>
    </nav>
</header>

<main class="container">
    <section class="hero">
        <h1>Welcome to Product Store</h1>
        <p>Browse our products, search for your favorite items, or add new products.</p>
        <input id="searchBox" class="search" type="search" placeholder="🔍  Search products...">
    </section>

    <div class="content-grid">
        <section id="products" class="panel">
            <h2>Products (<span th:text="${#lists.size(products)}">0</span>)</h2>
            <div class="product-grid">
                <article class="product-card" th:each="p : ${products}" th:attr="data-name=${p.name}">
                    <img th:src="${p.imageUrl}" th:alt="${p.name}">
                    <h3 th:text="${p.name}">Product</h3>
                    <div class="price">$<span th:text="${#numbers.formatDecimal(p.price, 1, 2)}">0.00</span></div>
                    <p th:text="${p.description}">Description</p>
                    <div class="actions">
                        <button class="edit-btn" type="button" onclick="editProduct()">Edit</button>
                        <form th:action="@{'/products/' + ${p.id} + '/delete'}" method="post">
                            <button class="delete-btn" type="submit">Delete</button>
                        </form>
                    </div>
                </article>
            </div>
            <p id="noResults" class="empty" hidden>No products found.</p>
        </section>

        <section class="panel add-panel">
            <h2>Add New Product</h2>
            <form action="/products" method="post">
                <label>Product Name</label>
                <input name="name" required placeholder="Enter product name">

                <label>Price</label>
                <input name="price" type="number" min="0" step="0.01" required placeholder="Enter price">

                <label>Description</label>
                <textarea name="description" required placeholder="Enter product description"></textarea>

                <label>Image URL</label>
                <input name="imageUrl" required placeholder="https://example.com/image.jpg">

                <button class="add-btn" type="submit">＋ Add Product</button>
            </form>
        </section>
    </div>
</main>

<footer>© 2025 Product Store. All rights reserved.</footer>
<script src="/js/app.js"></script>
</body>
</html>
